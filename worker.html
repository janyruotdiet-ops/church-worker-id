<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Worker QR Code</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background: #f4f6f8;
        }

        input {
            width: 280px;
            padding: 12px;
            font-size: 18px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        #qrcode {
            margin: 30px auto;
            width: fit-content;
            background: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Church Worker QR Code</h1>

    <input
        type="text"
        id="workerId"
        value="CW-2026-0015"
        placeholder="Enter Worker ID"
    >

    <button onclick="generateQR()">Generate QR Code</button>

    <div id="qrcode"></div>

    <script>
        function generateQR() {

            const workerId =
                document.getElementById("workerId").value.trim();

            if (!workerId) {
                alert("Please enter a Worker ID");
                return;
            }

            document.getElementById("qrcode").innerHTML = "";

            // The verification page
           const verificationURL =
    new URL(
        "verify.html?id=" + encodeURIComponent(workerId),
        window.location.href
    ).href;

            new QRCode(document.getElementById("qrcode"), {
                text: verificationURL,
                width: 350,
                height: 350
            });
        }
         // Generate automatically
        generateQR();
    </script>

</body>
</html>
